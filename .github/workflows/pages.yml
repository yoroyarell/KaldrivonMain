# kaldrivon.com: the site files of this repository plus the MiniSMO installers of the newest releases, served at
#   https://kaldrivon.com/downloads/minismo/<version>/Kaldrivon-MiniSMO-<version>-Setup.exe (and .sha256)
# Fixed, versioned URLs that answer 200 with the file (no redirect), as the Microsoft Store requires for EXE apps.
# The installers are fetched from the public GitHub releases at deploy time and never committed here.
# Needs Settings > Pages > Build and deployment > Source: GitHub Actions.
name: Deploy kaldrivon.com

on:
  push:
    branches: [main]
  schedule:
    - cron: "23 */6 * * *"        # picks up a new MiniSMO release within 6 hours
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/configure-pages@v5
      # the same Jekyll build as GitHub's branch deployment (sitemap.xml is a Jekyll template)
      - uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site
      - name: MiniSMO installers from the newest releases
        env:
          GH_TOKEN: ${{ github.token }}
          KEEP: "5"
        run: |
          bash scripts/fetch-minismo-downloads.sh "$RUNNER_TEMP/minismo"
          # the Jekyll step runs in a container and leaves _site owned by root
          sudo mkdir -p _site/downloads
          sudo cp -r "$RUNNER_TEMP/minismo" _site/downloads/minismo
          ls -la _site/downloads/minismo
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
